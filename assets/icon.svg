<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="GrowthScout">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a1560"/><stop offset="1" stop-color="#6a3fc4"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#c6f24a" stop-opacity=".35"/><stop offset="1" stop-color="#c6f24a" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="#07070a" opacity=".62"/>
  <!-- scope rings -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#f4f3ee" stroke-opacity=".35" stroke-width="10"/>
  <circle cx="256" cy="256" r="110" fill="none" stroke="#f4f3ee" stroke-opacity=".2" stroke-width="8"/>
  <!-- growth bars -->
  <rect x="176" y="288" width="40" height="64" rx="12" fill="#f4f3ee"/>
  <rect x="236" y="240" width="40" height="112" rx="12" fill="#f4f3ee"/>
  <rect x="296" y="176" width="40" height="176" rx="12" fill="#c6f24a"/>
  <!-- ping dot -->
  <circle cx="372" cy="140" r="46" fill="url(#glow)"/>
  <circle cx="372" cy="140" r="16" fill="#c6f24a"/>
</svg>
